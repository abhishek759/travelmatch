{% extends "base.html" %}

{% block title %}Sign up · TravelMatch{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card tm-auth-card">
      <div class="card-body">
        <h2 class="h4 mb-1">Create your account</h2>
        <p class="text-muted small mb-4">
          Join TravelMatch to find travel buddies and plan trips together.
        </p>
        <form method="post">
          {% csrf_token %}
          {{ form.as_p }}
          <button type="submit" class="btn btn-primary w-100 mt-2">Sign up</button>
        </form>
        <p class="mt-4 mb-0 small text-center text-muted">
          Already have an account?
          <a href="{% url 'login' %}">Login</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
