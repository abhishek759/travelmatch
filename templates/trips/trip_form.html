{% extends "base.html" %}

{% block title %}Create trip · TravelMatch{% endblock %}

{% block content %}
<h2 class="h4 mb-1">Create a new trip</h2>
<p class="text-muted small mb-4">
  Add the basics; members can join from the trip page.
</p>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn btn-primary">Save trip</button>
  <a href="{% url 'trip_list' %}" class="btn btn-link link-secondary ms-1"
    >Cancel</a
  >
</form>
{% endblock %}
